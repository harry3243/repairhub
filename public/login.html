<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log in – RepairHub</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main id="app">
    <div class="box" style="max-width:440px">
      <h2 id="title">Log in</h2>
      <div id="nameRow" class="mb-2" hidden><label class="form-label">Name</label><input id="name" class="form-control"></div>
      <div class="mb-2"><label class="form-label">Email</label><input id="email" type="email" class="form-control"></div>
      <div class="mb-2"><label class="form-label">Password</label><input id="password" type="password" class="form-control"></div>
      <div id="roleRow" class="mb-3" hidden>
        <label class="form-label">I am a</label>
        <select id="role" class="form-select"><option value="customer">Customer looking for repairs</option><option value="owner">Shop owner</option></select>
      </div>
      <button class="btn btn-light w-100" id="go">Log in</button>
      <p style="margin-top:1em"><a href="#" id="swap">New here? Create an account</a></p>
      <p class="muted">Demo logins (password <b>password123</b>): customer@demo.com, owner1@demo.com</p>
    </div>
  </main>
  <script src="js/api.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
