<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RepairHub – find repair shops near you</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main id="app">
    <div class="box">
      <h2>Find a repair shop without roaming around</h2>
      <p class="muted">See who is open right now, what it costs, and whether the spare part is in stock before you leave home.</p>
      <div class="filters">
        <input id="q" class="form-control" style="max-width:340px" placeholder="Try “iPhone 11 screen” or “Activa brake”" aria-label="Search">
        <button class="btn btn-light" id="searchBtn">Search</button>
        <button class="btn btn-outline-light" id="nearBtn">Use my location</button>
        <label class="toggle"><input type="checkbox" id="openOnly"> Open now</label>
      </div>
      <div class="filters" id="cats">
        <button class="chip on" data-c="">All</button>
        <button class="chip" data-c="mobile">Mobile</button>
        <button class="chip" data-c="bike">Bike</button>
        <button class="chip" data-c="auto">Auto / Car</button>
        <button class="chip" data-c="electronics">Electronics</button>
      </div>
    </div>
    <div id="count" class="muted" style="margin-bottom:.6em"></div>
    <div id="list" class="grid"></div>
  </main>
  <script src="js/api.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/home.js"></script>
</body>
</html>
